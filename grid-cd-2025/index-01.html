<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid CSS 01</title>
    <style>
        body{
            font-family: sans-serif;
            padding:48px;
        }
        h1{
            font-size: 1em;
        }
        img{
            display: block;
            width:100%;
        }
        a{
            color:currentColor;
            text-decoration: none;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, 320px);
            gap:12px;
            justify-items: stretch;
            align-items: stretch;
            grid-auto-rows: minmax(200px,auto);

            justify-content: center;
        }
        .item{
            background: #ddd;
        }
        .item-01{
            justify-self: start;
            align-self: end;
        }

        .item img{
            object-fit: cover;
            height:100%;
            width: 100%;
        }
        .header{
            display: grid;
            grid-template-columns: auto auto;
            justify-content: space-between;
            align-items:baseline;
            background: rgba(255, 166, 0, 0.5);
            padding:24px;
            border-radius: 62px;
            margin-bottom: 48px;
            position: sticky;
            top:0;
            backdrop-filter: blur(24px);
        }

    </style>
</head>
<body>
    <header class="header">
        <h1>bw</h1>
        <nav class="header-nav">
            <a href="#">à propos</a>
        </nav>
    </header>
    <div class="grid">
        <div class="item item-01">01</div>
        <div class="item"><img src="https://picsum.photos/200/300" alt="placeholder"></div>
        <div class="item"><img src="https://picsum.photos/300/300" alt="placeholder"></div>
        <div class="item"><img src="https://picsum.photos/400/300" alt="placeholder"></div>
        <div class="item"><img src="https://picsum.photos/200/400" alt="placeholder"></div>
        <div class="item"><img src="https://picsum.photos/600/500" alt="placeholder"></div>
        <div class="item"><img src="https://picsum.photos/800/700" alt="placeholder"></div>
        <div class="item"><img src="https://picsum.photos/300/300" alt="placeholder"></div>
        <div class="item">03</div>
        <div class="item">04</div>
        <div class="item">05</div>
        <div class="item">06</div>

    </div>
</body>
</html>
